<html lang="en">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="HitchCal">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="HitchCal">
<meta property="og:description" content="Rotation schedule, countdown to days off and hitch pay for oilfield and rotation workers.">
<meta property="og:type" content="website">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: iOS tab-bar app. One hero per screen (the countdown), inset grouped lists under it, a sheet for every edit. */
:root{
  --ts:1;
  color-scheme:light;
  --bg:#EFF0F2; --surface:#FFFFFF; --surface-up:#FFFFFF; --sheet:#EFF0F2; --cell:#FFFFFF;
  --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.22); --seg-on:#FFFFFF;
  --sep:rgba(60,60,67,.17);
  --label:#0B0B0F; --label-2:rgba(60,60,67,.68); --label-3:rgba(60,60,67,.36);
  --bar:rgba(244,245,247,.84);
  --tint:#4E5157; --tint-text:#24262A; --on-tint:#FFFFFF; --tint-soft:rgba(78,81,87,.13);
  --day:#5287B8; --day-text:#365979; --day-bg:rgba(82,135,184,0.15); --day-cell:rgba(82,135,184,0.34);
  --night:#7B67AD; --night-text:#514472; --night-bg:rgba(123,103,173,0.15); --night-cell:rgba(123,103,173,0.34);
  --home:#5E9470; --home-text:#3E624A; --home-bg:rgba(94,148,112,0.15); --home-cell:rgba(94,148,112,0.34);
  --danger:#FF3B30; --danger-text:#D12A20; --danger-bg:rgba(255,59,48,.12);
  --warn-text:#A85600; --warn-bg:rgba(255,149,0,.17);
  --hero-ink:#FFFFFF; --knob:#FFFFFF;
  --hero-day-a:#4877A2; --hero-day-b:#335472;
  --hero-night-a:#6C5B98; --hero-night-b:#4C406B;
  --hero-home-a:#538263; --hero-home-b:#3A5C45;
  --toast-bg:rgba(28,28,30,.94); --toast-ink:#FFFFFF;
  --scrim:rgba(0,0,0,.36);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
  --r-card:16px;
  --sat:0px; --sab:0px; --tabh:calc(52px + var(--sab)); --side:0px;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#000000;--surface:#1E1F23;--surface-up:#2C2D31;--sheet:#1E1F23;--cell:#1E1F23;--fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.38);--seg-on:#636366;--sep:rgba(84,84,88,.62);--label:#FFFFFF;--label-2:rgba(235,235,245,.64);--label-3:rgba(235,235,245,.3);--bar:rgba(20,20,22,.8);--tint:#B9BEC6;--tint-text:#D9DCE1;--on-tint:#16171A;--tint-soft:rgba(185,190,198,.18);--day:#5287B8;--day-text:#A5C1DA;--day-bg:rgba(82,135,184,0.3);--day-cell:rgba(82,135,184,0.55);--night:#7B67AD;--night-text:#BAB0D4;--night-bg:rgba(123,103,173,0.3);--night-cell:rgba(123,103,173,0.55);--home:#5E9470;--home-text:#ABC7B5;--home-bg:rgba(94,148,112,0.3);--home-cell:rgba(94,148,112,0.55);--danger:#FF453A;--danger-text:#FF6961;--danger-bg:rgba(255,69,58,.18);--warn-text:#FFB340;--warn-bg:rgba(255,159,10,.2);--toast-bg:rgba(235,235,240,.96);--toast-ink:#000000;--scrim:rgba(0,0,0,.55)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000000;--surface:#1E1F23;--surface-up:#2C2D31;--sheet:#1E1F23;--cell:#1E1F23;--fill:rgba(120,120,128,.24);--fill-2:rgba(120,120,128,.38);--seg-on:#636366;--sep:rgba(84,84,88,.62);--label:#FFFFFF;--label-2:rgba(235,235,245,.64);--label-3:rgba(235,235,245,.3);--bar:rgba(20,20,22,.8);--tint:#B9BEC6;--tint-text:#D9DCE1;--on-tint:#16171A;--tint-soft:rgba(185,190,198,.18);--day:#5287B8;--day-text:#A5C1DA;--day-bg:rgba(82,135,184,0.3);--day-cell:rgba(82,135,184,0.55);--night:#7B67AD;--night-text:#BAB0D4;--night-bg:rgba(123,103,173,0.3);--night-cell:rgba(123,103,173,0.55);--home:#5E9470;--home-text:#ABC7B5;--home-bg:rgba(94,148,112,0.3);--home-cell:rgba(94,148,112,0.55);--danger:#FF453A;--danger-text:#FF6961;--danger-bg:rgba(255,69,58,.18);--warn-text:#FFB340;--warn-bg:rgba(255,159,10,.2);--toast-bg:rgba(235,235,240,.96);--toast-ink:#000000;--scrim:rgba(0,0,0,.55)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--label);font:400 calc(17px*var(--ts))/1.3 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
h1,h2,h3,p{margin:0}
svg{display:block}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.sel{-webkit-user-select:text;user-select:text}

/* ── Shell ── */
.app{position:relative;height:100%;overflow:hidden;overflow:clip}
.views{position:absolute;inset:0 0 0 var(--side);overflow:hidden;overflow:clip}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.active{display:flex}
.scroll{flex:1;min-height:0;height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--tabh) + 32px)}
.wrap{width:100%;max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.navbar{position:sticky;top:0;z-index:20;padding-top:var(--sat);border-bottom:.5px solid transparent;transition:background .2s,border-color .2s}
.navbar-in{position:relative;height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.scrolled>.navbar{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.scrolled .nav-title{opacity:1}
.nav-sp{width:36px;height:36px;flex-shrink:0}
.eyebrow{font-size:calc(13px*var(--ts));font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.04em}
.lt{font-size:calc(34px*var(--ts));line-height:41px;font-weight:800;letter-spacing:-.022em;margin-bottom:14px;text-wrap:balance}

.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;height:var(--tabh);padding:0 env(safe-area-inset-right,0px) var(--sab) env(safe-area-inset-left,0px);display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:calc(10px*var(--ts));font-weight:500;color:var(--label-3);transition:transform .15s}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--tint-text);font-weight:600}
.tab:active{transform:scale(.92)}
.brand{display:none;align-items:center;gap:10px;font-weight:800;font-size:calc(20px*var(--ts));letter-spacing:-.02em;padding:6px 12px 22px}
.brand svg{width:30px;height:30px}

/* ── Type & common ── */
.sec-title{font-size:calc(20px*var(--ts));font-weight:700;letter-spacing:-.01em;margin:28px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec-h{font-size:calc(13px*var(--ts));text-transform:uppercase;letter-spacing:.03em;color:var(--label-2);margin:24px 16px 7px}
.foot{font-size:calc(13px*var(--ts));line-height:1.4;color:var(--label-2);margin:8px 16px 0}
.dim{opacity:.45}
.mut{color:var(--label-2)}
.num{font-variant-numeric:tabular-nums}

.group{background:var(--surface);border-radius:var(--r-card);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:9px 16px;width:100%}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.group.ic .row+.row::before{left:58px}
button.row:active,.card-btn:active{background:var(--fill)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;overflow-wrap:anywhere}
.row .t small{display:block;font-size:calc(13px*var(--ts));line-height:1.35;color:var(--label-2);overflow-wrap:anywhere}
.row .k{flex:1;min-width:34%}
.row .v{color:var(--label-2);flex:0 1 auto;min-width:0;text-align:right;font-variant-numeric:tabular-nums}
.row.red{color:var(--danger-text);justify-content:center;font-weight:500}
.chev{width:8px;height:14px;color:var(--label-3);flex-shrink:0}
.itile{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--hero-ink);background:var(--c,var(--tint));flex-shrink:0}
.itile svg{width:18px;height:18px}
.itile.e{background:var(--fill);font-size:calc(17px*var(--ts))}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:calc(12px*var(--ts));font-weight:600;line-height:1;padding:5px 9px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.c-day{background:var(--day-bg);color:var(--day-text)}
.c-night{background:var(--night-bg);color:var(--night-text)}
.c-home{background:var(--home-bg);color:var(--home-text)}
.c-warn{background:var(--warn-bg);color:var(--warn-text)}
.c-danger{background:var(--danger-bg);color:var(--danger-text)}
.c-gray{background:var(--fill);color:var(--label-2)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:0 18px;border-radius:14px;font-weight:600;text-align:center;transition:transform .12s,opacity .12s}
.btn svg{width:20px;height:20px}
.btn:active{transform:scale(.98);opacity:.75}
.btn.primary{background:var(--tint);color:var(--on-tint)}
.btn.gray{background:var(--fill);color:var(--tint-text)}
.btn.plain{color:var(--tint-text);min-height:44px}
.btn.del{background:var(--danger-bg);color:var(--danger-text);margin-top:20px}
.txt-btn{color:var(--tint-text);min-height:44px;min-width:44px;padding:0 2px;white-space:nowrap}
.txt-btn.strong{font-weight:600;text-align:right}
.txt-btn:active,.icon-btn:active,.pill-btn:active{opacity:.5}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--tint-text);flex-shrink:0}
.icon-btn svg{width:18px;height:18px}
.pill-btn{height:36px;padding:0 14px;border-radius:99px;background:var(--fill);color:var(--tint-text);font-size:calc(15px*var(--ts));font-weight:600;flex-shrink:0}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--on-tint);font-size:calc(14px*var(--ts));font-weight:700;flex-shrink:0}
.avatar.lg{width:56px;height:56px;font-size:calc(21px*var(--ts))}

.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;min-width:0;height:30px;border-radius:7px;font-size:calc(13px*var(--ts));font-weight:500;text-align:center;padding:0 10px;white-space:nowrap}
.seg button.on{background:var(--seg-on);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.sm{flex-shrink:0}
.seg.sm button{height:26px;padding:0 12px}
.switch{position:relative;width:51px;height:31px;border-radius:99px;background:var(--fill-2);transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--knob);box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .22s var(--ease)}
.switch.on{background:var(--home)}
.switch.on::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;height:34px;background:var(--fill);border-radius:9px;flex-shrink:0}
.stepper button{width:40px;height:34px;display:grid;place-items:center;font-size:calc(21px*var(--ts));line-height:1;color:var(--label)}
.stepper button:active{opacity:.4}
.stepper input{width:44px;border:0;background:none;text-align:center;font-weight:600;outline:0;padding:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pchip{height:36px;padding:0 14px;border-radius:99px;background:var(--surface);font-size:calc(15px*var(--ts));font-weight:600;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px var(--sep)}
.pchip.on{background:var(--tint);color:var(--on-tint);box-shadow:none}

.form .row input[type=text]{flex:1.4;min-width:0;border:0;background:none;outline:0;text-align:right;padding:6px 0}
.form .row input[type=date],.form .row input[type=time]{border:0;background:var(--fill);border-radius:8px;padding:6px 10px;font-size:calc(16px*var(--ts));outline:0;max-width:60%;min-height:34px;font-family:var(--font)}
.form .affix{color:var(--label-2);margin-right:-8px}
.form textarea{display:block;width:100%;border:0;background:none;outline:0;resize:none;padding:12px 16px;min-height:84px;line-height:1.4}
.form input::placeholder,.form textarea::placeholder{color:var(--label-3)}
.empty{text-align:center;padding:36px 20px 28px;background:var(--surface);border-radius:var(--r-card)}
.empty .ei{width:56px;height:56px;border-radius:16px;background:var(--tint-soft);color:var(--tint-text);display:grid;place-items:center;margin:0 auto 14px}
.empty .ei svg{width:28px;height:28px}
.empty h3{font-size:calc(20px*var(--ts));font-weight:700}
.empty p{font-size:calc(15px*var(--ts));color:var(--label-2);margin:6px auto 18px;max-width:30ch;line-height:1.4}

/* ── Today ── */
.hero{position:relative;border-radius:22px;padding:18px 18px 16px;color:var(--hero-ink);background:linear-gradient(150deg,var(--h1),var(--h2));overflow:hidden}
.hero.day{--h1:var(--hero-day-a);--h2:var(--hero-day-b)}
.hero.night{--h1:var(--hero-night-a);--h2:var(--hero-night-b)}
.hero.home{--h1:var(--hero-home-a);--h2:var(--hero-home-b)}
.hero .lab{font-size:calc(12px*var(--ts));font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.88;padding-right:72px}
.hero .lead{font-size:calc(15px*var(--ts));font-weight:500;opacity:.92;margin-top:18px}
.hero .sub{font-size:calc(15px*var(--ts));opacity:.88;margin-top:8px}
.cd{font:800 clamp(27px,9.4vw,40px)/1.08 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.cd .u{font-size:.5em;font-weight:700;opacity:.8;margin:0 .3em 0 .05em}
.cd .s{opacity:.62}
.ring{position:absolute;top:14px;right:14px;width:60px;height:60px}
.ring svg{width:60px;height:60px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .tr{stroke:currentColor;opacity:.25}
.ring .ar{stroke:currentColor;transition:stroke-dashoffset 1s linear}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .mid b{font:800 calc(19px*var(--ts))/1 var(--font-num);font-variant-numeric:tabular-nums}
.ring .mid small{font-size:calc(9px*var(--ts));font-weight:600;opacity:.85;margin-top:2px}
.banner{display:flex;align-items:center;gap:12px;width:100%;background:var(--tint-soft);border-radius:var(--r-card);padding:12px 14px;margin-bottom:12px;font-size:calc(15px*var(--ts));line-height:1.35}
.banner b{color:var(--tint-text);font-weight:600;white-space:nowrap}
.banner span{flex:1;min-width:0}
.twoweek .dow{padding-top:0}
.tw-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.tw-grid .cell{aspect-ratio:1}
.tw-grid .cell .bar{height:5px;bottom:calc(3px + var(--i) * 7px)}
.tw-grid .cell .bar span{display:none}
.tw-grid .cell .em{position:absolute;top:6px;right:4px;font-size:calc(13px*var(--ts));padding:0}
.tw-grid .cell .ce{top:auto;bottom:5px}
.dchip{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:calc(11px*var(--ts));font-weight:600;color:var(--label-2)}
.dchip b{width:34px;height:34px;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:calc(15px*var(--ts));font-weight:600;color:var(--label);background:var(--fill);font-variant-numeric:tabular-nums}
.dchip.d b{background:var(--day);color:var(--hero-ink)}
.dchip.n b{background:var(--night);color:var(--hero-ink)}
.dchip.now b{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--tint)}
.dchip:active b{transform:scale(.9)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:calc(12px*var(--ts));color:var(--label-2);margin:8px 16px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.card-btn{display:block;width:100%;background:var(--surface);border-radius:var(--r-card);padding:14px 16px}
.pay-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pay-line .big{font:800 calc(28px*var(--ts))/1.1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pay-line+.cap{margin-top:6px}
.track{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin:10px 0 8px}
.track i{display:block;height:100%;border-radius:inherit;background:var(--tint)}
.cap{font-size:calc(13px*var(--ts));color:var(--label-2);display:flex;justify-content:space-between;gap:10px}

/* ── Calendar ── */
.cal-wrap{height:100%;max-width:1040px;display:flex;flex-direction:column;padding-block:calc(var(--sat) + 4px) calc(var(--tabh) + 8px)}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.cal-title{font-size:calc(26px*var(--ts));line-height:1.15;font-weight:800;letter-spacing:-.022em;min-width:0}
.cal-title span{font-size:calc(17px*var(--ts));font-weight:500;color:var(--label-2);letter-spacing:0}
.cal-ctl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cal-wrap>.seg{margin-top:8px;flex-shrink:0}
.strip{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:9px 12px;border-radius:12px;background:var(--surface);font-size:calc(14px*var(--ts));font-weight:600;flex-shrink:0}
.strip .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0}
.strip .t{flex:1;min-width:0}
.strip .r{color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;font-size:calc(11px*var(--ts));font-weight:600;color:var(--label-2);text-align:center;padding:10px 0 5px;flex-shrink:0}
.cal-main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.month{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:3px;touch-action:pan-y;overflow:hidden}
.month.go-l{animation:goL .3s var(--ease)}
.month.go-r{animation:goR .3s var(--ease)}
@keyframes goL{from{transform:translateX(28px);opacity:.25}}
@keyframes goR{from{transform:translateX(-28px);opacity:.25}}
.cell{position:relative;border-radius:10px;padding:4px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0;--c:transparent;--a:0%;--b:100%}
.cell .bgl{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:linear-gradient(90deg,transparent 0 var(--a),var(--c) var(--a) var(--b),transparent var(--b) 100%),var(--cell)}
.cell.d{--c:var(--day-cell)}
.cell.n{--c:var(--night-cell)}
.cell.out{opacity:.38}
.cell:active .bgl{filter:brightness(.93)}
.cell:focus-visible{outline-offset:-2px}
.cell .hl{position:relative;z-index:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:calc(7.5px*var(--ts));line-height:12px;font-weight:800;padding:0 3px;margin-top:1px;border-radius:999px;background:var(--hol);color:var(--hol-ink)}
.cell .dn{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:calc(15px*var(--ts));font-weight:600;font-variant-numeric:tabular-nums}
.cell.d.full .dn,.cell.d.lead .dn{color:var(--day-text)}
.cell.n.full .dn,.cell.n.lead .dn{color:var(--night-text)}
.month .cell.now .dn,.tw-grid .cell.now .dn{background:var(--tint);color:var(--on-tint);font-weight:700}
.cell .em{position:relative;z-index:1;font-size:calc(15px*var(--ts));line-height:1.1;padding-left:3px}
.cell .nd{position:relative;z-index:1;width:6px;height:6px;border-radius:50%;background:var(--tint);margin:2px 0 0 10px}
.cell .ce{position:absolute;top:6px;right:5px;z-index:1;width:14px;height:14px;color:var(--danger)}
.cell .bar{position:absolute;left:-2px;right:-2px;bottom:calc(3px + var(--i) * 12px);height:10px;background:var(--rc);z-index:2;pointer-events:none}
.cell .bar.s{left:3px;border-radius:5px 0 0 5px;z-index:3}
.cell .bar.e{right:3px;border-radius:0 5px 5px 0}
.cell .bar.s.e{border-radius:5px}
.cell .bar.nm{z-index:3}
.cell .bar span{display:block;padding-left:4px;font-size:calc(7.5px*var(--ts));line-height:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;color:var(--ri)}
.cal-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin-top:10px;padding-bottom:12px}
.year{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px;align-items:start}
.mini{display:block;width:100%;border-radius:10px;padding:2px}
.mini:active{background:var(--fill)}
.mini-name{display:block;font-size:calc(17px*var(--ts));font-weight:700;margin-bottom:5px;letter-spacing:-.01em}
.mini-name.cur{color:var(--tint-text)}
.mini-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1.5px}
.mini-grid i{font-style:normal;font-size:calc(8.5px*var(--ts));aspect-ratio:1;display:grid;place-items:center;border-radius:3px;color:var(--label-2);font-variant-numeric:tabular-nums}
.mini-grid i.d{background:var(--day-cell);color:var(--day-text);font-weight:600}
.mini-grid i.n{background:var(--night-cell);color:var(--night-text);font-weight:600}
.mini-grid i.t{background:var(--tint);color:var(--on-tint);font-weight:700}
.ag-month{font-size:calc(20px*var(--ts));font-weight:700;margin:20px 0 8px;letter-spacing:-.01em}
.ag-month:first-child{margin-top:2px}
.ag-row{align-items:flex-start}
.ag-date{width:38px;flex-shrink:0;text-align:center;line-height:1.1;padding-top:2px}
.ag-date small{display:block;font-size:calc(11px*var(--ts));font-weight:600;color:var(--label-2);text-transform:uppercase}
.ag-date b{font-size:calc(20px*var(--ts));font-weight:600;font-variant-numeric:tabular-nums}
.ag-row.now .ag-date b{color:var(--tint-text)}
.ag-ev{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:calc(15px*var(--ts));line-height:1.35;padding:2px 0}
.ag-ev div{display:flex;gap:8px;align-items:baseline;overflow-wrap:anywhere}
.ag-ev i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--label-3));flex-shrink:0}

/* ── Pay / Crew / More ── */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:var(--r-card);padding:13px 14px;min-width:0}
.tile small{display:block;font-size:calc(13px*var(--ts));color:var(--label-2)}
.tile b{display:block;font:700 min(calc(22px*var(--ts)),5.6vw)/1.2 var(--font-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px}
.tile span{display:block;font-size:calc(12px*var(--ts));color:var(--label-2);margin-top:2px}
.pcard{background:var(--surface);border-radius:var(--r-card);padding:16px}
.pcard .big{font:800 clamp(32px,10vw,42px)/1.1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.me{display:flex;align-items:center;gap:14px}
.me .t{flex:1;min-width:0}
.me .t b{display:block;font-size:calc(20px*var(--ts));font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.me .t small{display:block;font-size:calc(14px*var(--ts));color:var(--label-2);line-height:1.35}
.pcard .btn{margin-top:14px}
.rc{display:block;width:100%;background:var(--surface);border-radius:var(--r-card);padding:14px 16px}
.rc+.rc{margin-top:10px}
.rc-h{display:flex;align-items:center;gap:10px}
.rc-h .sw{width:12px;height:12px;border-radius:50%;background:var(--rc);flex-shrink:0}
.rc-h b{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.rc-sub{font-size:calc(13px*var(--ts));color:var(--label-2);margin:2px 0 0 22px}
.rc-l{margin-top:10px;border-top:.5px solid var(--sep);padding-top:8px}
.rc-l h4{margin:0 0 2px;font-size:calc(12px*var(--ts));font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.03em}
.rc-l div{display:flex;justify-content:space-between;gap:10px;font-size:calc(15px*var(--ts));padding:4px 0}
.rc-l div span:last-child{color:var(--home-text);font-weight:600;white-space:nowrap}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px}
.swatch{width:34px;height:34px;border-radius:50%;background:var(--rc)}
.swatch.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--rc)}
.emojis{display:flex;gap:4px;overflow-x:auto;padding:10px 12px;border-bottom:.5px solid var(--sep);scrollbar-width:none}
.emojis::-webkit-scrollbar{display:none}
.emo{width:38px;height:38px;border-radius:10px;font-size:calc(20px*var(--ts));display:grid;place-items:center;flex-shrink:0;color:var(--label-2)}
.emo.on{background:var(--tint-soft);box-shadow:inset 0 0 0 1.5px var(--tint)}
.dstat{display:flex;align-items:center;gap:12px;border-radius:var(--r-card);padding:14px;background:var(--c-bg);color:var(--c-tx)}
.dstat svg{width:26px;height:26px;flex-shrink:0}
.dstat b{display:block;font-size:calc(17px*var(--ts));font-weight:700}
.dstat small{display:block;font-size:calc(14px*var(--ts));line-height:1.35;opacity:.9}
.dstat.d{--c-bg:var(--day-bg);--c-tx:var(--day-text)}
.dstat.n{--c-bg:var(--night-bg);--c-tx:var(--night-text)}
.dstat.h{--c-bg:var(--home-bg);--c-tx:var(--home-text)}
.code{display:block;width:100%;background:var(--surface);border-radius:12px;padding:12px 14px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere;white-space:pre-wrap;max-height:220px;overflow-y:auto;margin-bottom:12px;border:0;outline:0;resize:none;color:var(--label)}
.about{text-align:center;font-size:calc(13px*var(--ts));color:var(--label-2);margin-top:26px;line-height:1.5}

.avatar{overflow:hidden;background:var(--av,var(--tint));color:var(--avi,var(--on-tint))}
.avatar svg{width:100%;height:100%}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:30px;height:30px;font-size:calc(11px*var(--ts));box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--av,transparent);margin:0 3px}
.rc-h+.rc-sub{margin-left:38px}
.avpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:14px 8px;padding:14px 12px}
.avopt{width:54px;height:54px;border-radius:50%;background:var(--fill);color:var(--label);display:grid;place-items:center;justify-self:center;overflow:hidden;font-size:calc(14px*var(--ts));font-weight:700}
.avopt svg{width:26px;height:26px}
.avi{display:block;width:100%;height:100%;object-fit:cover}
.avopt img{width:100%;height:100%;object-fit:cover}
.avopt.on{background:var(--tint);color:var(--on-tint);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--tint)}
.avopt:active{transform:scale(.92)}
.avgrp{grid-column:1/-1;font-size:calc(12px*var(--ts));font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--label-2);margin:2px 4px -4px}
.avgrp.avcap{text-transform:none;letter-spacing:0;font-size:calc(15px*var(--ts));color:var(--label);text-align:center;margin:4px 0 0}

.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.theme-btn{background:var(--surface);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.theme-btn b{font-weight:600;font-size:calc(14px*var(--ts));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme-btn span{gap:3px}.theme-btn span i{width:12px;height:12px}
.theme-btn span,.cdots{display:flex;gap:5px;flex-shrink:0}
.theme-btn i,.cdots i{width:18px;height:18px;border-radius:50%}
.cdots i{width:14px;height:14px}
.theme-btn.on{box-shadow:0 0 0 2px var(--tint)}
.cswatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:12px 8px;padding:14px 12px}
.cs{position:relative;width:32px;height:32px;border-radius:50%;background:var(--rc);justify-self:center;display:block;cursor:pointer}
.cs.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--rc)}
.cs.custom{background:conic-gradient(#FF3B30,#FF9F0A,#34C759,#0E9F8E,#007AFF,#A855F7,#E8508C,#FF3B30)}
.cs.custom.on{background:var(--rc)}
.cs.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}

.btn-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.pcard .btn-row .btn{margin-top:0}
.family{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg);padding-bottom:calc(var(--sab) + 36px)}
.fam-wrap{max-width:560px;padding-top:calc(var(--sat) + 22px)}
.fam-bar+.fam-wrap{padding-top:18px}
.fam-bar{position:sticky;top:0;z-index:5;padding-top:var(--sat);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.fam-bar-in{max-width:560px;display:flex;align-items:center;gap:12px;min-height:56px}
.fam-bar-in .t{flex:1;min-width:0}
.fam-bar-in .t b{display:block;font-size:calc(15px*var(--ts))}
.fam-bar-in .t small{display:block;font-size:calc(13px*var(--ts));color:var(--label-2)}
.fam-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.fam-h1{font-size:calc(30px*var(--ts));line-height:1.15;font-weight:800;letter-spacing:-.022em;text-wrap:balance}
.fam-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.fam-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border-radius:var(--r-card);padding:12px 10px}
.fam-cal small{font-size:calc(11px*var(--ts));font-weight:600;color:var(--label-2);text-align:center;padding-bottom:4px}
.fc{position:relative;aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:calc(15px*var(--ts));font-variant-numeric:tabular-nums;--c:transparent;--a:0%;--b:0%;background:linear-gradient(90deg,transparent 0 var(--a),var(--c) var(--a) var(--b),transparent var(--b) 100%),var(--fill)}
.fc.d{--c:color-mix(in srgb,var(--day) 42%,transparent)}
.fc.n{--c:color-mix(in srgb,var(--night) 46%,transparent)}
.fc b{font-weight:500}
.fc.full b{font-weight:700}
.fc.now b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--on-tint);font-weight:700}
.fc .hd{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--danger)}
.fam-cta{margin-top:22px;text-decoration:none}
.sec-title .cal-ctl .icon-btn{width:32px;height:32px}

/* ── Push page ── */
.page{position:absolute;inset:0;z-index:30;background:var(--bg);transform:translateX(100%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s}
.page.open{transform:none;visibility:visible;transition:transform .4s var(--ease),visibility 0s}
.back-btn{display:flex;align-items:center;gap:5px;color:var(--tint-text);min-height:44px;padding-right:8px}
.back-btn svg{width:11px;height:19px}

/* ── Sheets, alerts, toast ── */
.sheet-wrap,.alert-wrap{position:absolute;inset:0;z-index:60}
.alert-wrap{z-index:70}
.backdrop{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s}
.open>.backdrop{opacity:1}
.sheet{--surface:var(--surface-up);position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - var(--sat) - 20px);display:flex;flex-direction:column;background:var(--sheet);border-radius:16px 16px 0 0;transform:translateY(102%);transition:transform .42s var(--ease);padding-bottom:var(--sab);box-shadow:0 -8px 40px rgba(0,0,0,.18)}
.open>.sheet{transform:none}
.grab{flex-shrink:0;height:18px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab::after{content:"";width:36px;height:5px;border-radius:99px;background:var(--label-3)}
.sheet-head{flex-shrink:0;display:grid;grid-template-columns:minmax(64px,1fr) auto minmax(64px,1fr);align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));touch-action:none}
.sheet-title{font-weight:600;text-align:center;min-width:0;overflow-wrap:anywhere}
.sheet-head .strong{justify-self:end}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.sheet-body>.sec-h:first-child{margin-top:8px}
.asheet{position:absolute;left:8px;right:8px;bottom:calc(8px + var(--sab));max-width:420px;margin:0 auto;transform:translateY(120%);transition:transform .36s var(--ease)}
.open>.asheet{transform:none}
.as-box{background:var(--surface-up);border-radius:14px;overflow:hidden;text-align:center}
.as-msg{padding:14px 18px;border-bottom:.5px solid var(--sep)}
.as-msg b{display:block;font-size:calc(13px*var(--ts));font-weight:600;color:var(--label-2)}
.as-msg span{display:block;font-size:calc(13px*var(--ts));color:var(--label-2);margin-top:3px;line-height:1.4}
.as-btn{display:block;width:100%;min-height:56px;font-size:calc(20px*var(--ts));text-align:center;color:var(--tint-text)}
.as-btn.red{color:var(--danger-text)}
.as-btn.cancel{font-weight:600;background:var(--surface-up);border-radius:14px;margin-top:8px}
.as-btn:active{background:var(--fill)}
.toast{position:absolute;left:50%;bottom:calc(var(--tabh) + 18px);z-index:90;max-width:calc(100% - 32px);transform:translate(-50%,16px);opacity:0;background:var(--toast-bg);color:var(--toast-ink);font-size:calc(15px*var(--ts));font-weight:500;padding:10px 18px;border-radius:99px;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ── Onboarding ── */
.onboard{position:absolute;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab)}
.ob-top{display:flex;align-items:center;justify-content:space-between;min-height:44px;flex-shrink:0}
.ob-top .txt-btn{min-width:64px}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--fill-2);transition:background .2s,width .2s}
.dots i.on{background:var(--tint);width:20px;border-radius:99px}
.ob-body{flex:1;min-height:0;overflow-y:auto;padding-bottom:12px}
.ob-step{padding-top:8px;animation:obIn .4s var(--ease)}
@keyframes obIn{from{opacity:0;transform:translateX(18px)}}
.ob-step h1{font-size:calc(32px*var(--ts));line-height:1.12;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.ob-step .lede{font-size:calc(17px*var(--ts));line-height:1.4;color:var(--label-2);margin:10px 0 22px;max-width:34ch}
.ob-mark{width:64px;height:64px;margin:18px 0 20px}
.ob-eg{margin-top:4px}
.ob-eg-tag{font-size:calc(12px*var(--ts));font-weight:600;color:var(--label-2);text-transform:uppercase;letter-spacing:.04em;margin:0 4px 6px}
.ob-pts{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.ob-pts div{display:flex;gap:12px;align-items:flex-start;font-size:calc(15px*var(--ts));line-height:1.4}
.ob-pts .itile{margin-top:1px}
.ob-pts b{display:block;font-weight:600}
.ob-pts span span{color:var(--label-2)}
.ob-foot{flex-shrink:0;padding-top:10px;padding-bottom:14px;display:flex;flex-direction:column;gap:2px}
.prev{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;background:var(--surface);border-radius:var(--r-card);padding:12px 10px}
.prev small{font-size:calc(10px*var(--ts));font-weight:600;color:var(--label-2);text-align:center;padding-bottom:3px}
.prev i{font-style:normal;aspect-ratio:1.25;display:grid;place-items:center;border-radius:7px;font-size:calc(13px*var(--ts));font-weight:600;font-variant-numeric:tabular-nums;color:var(--label-2);background:var(--fill)}
.prev i.d{background:var(--day);color:var(--hero-ink)}
.prev i.n{background:var(--night);color:var(--hero-ink)}
.prev i.st{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--tint)}
.ob-sum{font-size:calc(15px*var(--ts));line-height:1.4;color:var(--label-2);margin:12px 4px 0}
.ob-sum b{color:var(--label);font-weight:600}

/* ── Wider screens: tab bar becomes a sidebar, sheets become dialogs ── */
@media (min-width:900px){
  :root{--tabh:0px;--side:232px}
  .tabbar{top:0;right:auto;width:var(--side);height:auto;flex-direction:column;justify-content:flex-start;gap:2px;padding:calc(var(--sat) + 20px) 12px 20px;border-top:0;border-right:.5px solid var(--sep);background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
  .brand{display:flex}
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;height:44px;padding:0 12px;border-radius:10px;font-size:calc(15px*var(--ts));font-weight:500;color:var(--label)}
  .tab svg{width:22px;height:22px;color:var(--label-2)}
  .tab.on{background:var(--tint-soft);font-weight:600}
  .tab.on svg{color:var(--tint-text)}
  .tab:active{transform:none}
  .scroll{padding-bottom:48px}
  .cal-wrap{padding-block:16px 20px}
  .cell{border-radius:12px;padding:6px}
  .year{grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 22px}
  .mini-grid i{font-size:calc(11px*var(--ts))}
  .toast{bottom:28px}
  .onboard .wrap{max-width:520px}
}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(540px,calc(100% - 32px));max-height:min(86%,760px);border-radius:18px;padding-bottom:0;transform:translate(-50%,-46%);opacity:0;transition:transform .3s var(--ease),opacity .2s}
  .open>.sheet{transform:translate(-50%,-50%);opacity:1}
  .grab{height:14px;cursor:default}
  .grab::after{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

/* Insights: compact holiday tiles */
.hol-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hol{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:center;text-align:left;background:var(--surface);border-radius:12px;padding:9px 11px;min-width:0;color:var(--label)}
.hol b{display:block;font-size:calc(14px*var(--ts));font-weight:600;line-height:1.25}
.hol small{display:block;font-size:calc(12px*var(--ts));color:var(--label-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hol.off{box-shadow:inset 3px 0 0 var(--home)}
.hol.off small{color:var(--home-text)}

/* Color picker with live preview */
.pk{padding:0 2px 12px}
.pk-prev{background:var(--surface);border-radius:var(--r-card);padding:14px;display:grid;gap:10px;margin:0 0 12px}
.pv-row{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pv-cell{position:relative;height:46px;border-radius:9px;padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;overflow:hidden;min-width:0}
.pv-cell b{font-size:calc(13px*var(--ts));font-weight:600;color:var(--label)}
.pv-bar{display:block;height:6px;border-radius:3px;margin:0 -6px -5px;width:calc(100% + 12px)}
.pv-hol{font-size:calc(8px*var(--ts));font-weight:800;border-radius:999px;padding:1px 4px;white-space:nowrap;align-self:flex-start}
.pv-today{position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:calc(11px*var(--ts));font-weight:700}
.pv-note{font-size:calc(14px*var(--ts));font-weight:600}
.pv-hero{border-radius:14px;padding:12px 14px;color:#fff;font-weight:700;font-size:calc(15px*var(--ts))}
.pv-btns{display:flex;gap:8px}
.pv-btn{border-radius:999px;padding:7px 14px;font-size:calc(14px*var(--ts));font-weight:600}
.pk-hex{display:flex;align-items:center;gap:10px;margin:0 2px 10px;font-size:calc(15px*var(--ts))}
.pk-sw{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pk-sl{display:grid;gap:6px;margin:0 2px 14px;font-size:calc(13px*var(--ts));color:var(--label-2)}
.pk-r{-webkit-appearance:none;appearance:none;width:100%;height:28px;border-radius:14px;margin:0;outline:none}
.pk-r.hue{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.pk-r::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pk-r::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pk-btns{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.pk-btns .btn{margin:0}

/* Compact color rows: one line of swatches per color, scrolls sideways */
.crow{padding:11px 0 10px}
.crow+.crow{box-shadow:inset 0 .5px 0 var(--sep)}
.crow-h{display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:calc(15px*var(--ts));margin-bottom:6px}
.cnow{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cline{display:flex;align-items:center;gap:10px;overflow-x:auto;padding:5px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cline::-webkit-scrollbar{display:none}
.cline .cs{width:30px;height:30px;flex:0 0 30px;justify-self:auto}
.cdiv{flex:0 0 1px;height:22px;background:var(--sep)}

/* Text size: every font size multiplies by --ts */
:root[data-ts="l"]{--ts:1.12}
:root[data-ts="xl"]{--ts:1.24}
.seg .ts1{font-size:13px}.seg .ts2{font-size:16px}.seg .ts3{font-size:19px;line-height:1}
.seg .ts1,.seg .ts2,.seg .ts3{font-weight:700}

/* Reduce motion: the app setting, or the phone's own setting */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
:root[data-rm] *,:root[data-rm] *::before,:root[data-rm] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
:root[data-outline] *{outline:1px solid rgba(255,59,48,.35)}

/* About line doubles as the developer-menu switch */
button.about{display:block;width:100%;background:none;border:0;padding:6px 0;font-family:inherit;color:var(--label-2);cursor:default}
.tick{color:var(--tint-text);font-weight:700;margin-left:auto;padding-left:8px}

/* What's new, FAQ, legal, diagnostics */
.wn-v{font-size:calc(13px*var(--ts));color:var(--label-2);margin:2px 4px 12px}
.wn{display:grid;gap:16px;padding:0 4px 8px}
.wn-i{display:flex;gap:12px;align-items:flex-start}
.wn-ic{flex:0 0 32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--hol);color:var(--hol-ink)}
.wn-ic svg{width:18px;height:18px}
.wn-i b{font-size:calc(16px*var(--ts))}.wn-i p{margin:2px 0 0;color:var(--label-2);font-size:calc(14px*var(--ts));line-height:1.4}
.faq{background:var(--surface);border-radius:var(--r-card);overflow:hidden}
.faq details{padding:0 16px}.faq details+details{box-shadow:inset 0 .5px 0 var(--sep)}
.faq summary{list-style:none;cursor:pointer;padding:14px 22px 14px 0;font-size:calc(16px*var(--ts));font-weight:600;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';position:absolute;right:0;top:12px;font-size:calc(20px*var(--ts));font-weight:400;color:var(--label-3)}
.faq details[open] summary::after{content:'–'}
.faq p{margin:-4px 0 14px;color:var(--label-2);font-size:calc(15px*var(--ts));line-height:1.45}
.legal{padding:0 4px 12px;font-size:calc(15px*var(--ts));line-height:1.5}
.legal h3{font-size:calc(16px*var(--ts));margin:18px 0 4px}.legal p,.legal ul{margin:0 0 8px;color:var(--label-2)}
.legal ul{padding-left:18px}.legal li{margin-bottom:6px}.legal b{color:var(--label)}
.legal-date{font-size:calc(13px*var(--ts));color:var(--label-3)!important}
pre.diag{white-space:pre-wrap;word-break:break-word;background:var(--surface);border-radius:12px;padding:12px;margin:0 0 10px;font:500 calc(11.5px*var(--ts))/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--label-2);max-height:220px;overflow:auto}
.dev-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}.dev-btns .btn{margin:0}
.btn[disabled]{opacity:.45;pointer-events:none}

/* New version banner, above the tab bar */
.upd{position:absolute;left:12px;right:12px;bottom:calc(var(--tabh) + 12px);z-index:95;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:16px;background:var(--sheet);box-shadow:0 8px 28px rgba(0,0,0,.28);font-size:calc(15px*var(--ts))}
.upd span{flex:1;min-width:0}
.upd button{flex:0 0 auto;border:0;border-radius:999px;padding:8px 14px;font:600 calc(15px*var(--ts)) var(--font);background:var(--tint);color:var(--on-tint)}
/* Like iOS, bars keep their size when text is enlarged */
.navbar,.tabbar{--ts:1}

/* Insights: year at a glance */
.glance{background:var(--surface);border-radius:var(--r-card);padding:14px 16px;margin-bottom:10px}
.gl-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gl-top b{font:700 calc(28px*var(--ts))/1 var(--font-num);color:var(--home-text)}
.gl-top span{color:var(--label-2);font-size:calc(14px*var(--ts));min-width:0}
.gl-bar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin:12px 0 10px}
.gl-bar i{display:block;min-width:2px}
.gl-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:calc(13px*var(--ts));color:var(--label-2)}
.gl-leg span{display:inline-flex;align-items:center;gap:6px}.gl-leg i{width:9px;height:9px;border-radius:3px;display:block}
.gl-leg b{color:var(--label);font-variant-numeric:tabular-nums}
/* Family date status chips and calendar label */
.chip.ok{background:var(--home-bg);color:var(--home-text)}
.chip.miss{background:var(--fill);color:var(--label-2)}
.cell .hl.fam{background:none;padding:0;font-size:calc(11px*var(--ts));line-height:13px;overflow:visible}
.sec-title .txt-btn{margin-left:auto}
/* Holiday icons on the Insights tiles */
.hol-ic{grid-row:span 2;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--fill);color:var(--label-2)}
.hol-ic svg{width:18px;height:18px}
.hol.off .hol-ic{background:var(--hol);color:var(--hol-ink)}
.hol b,.hol small{min-width:0}
/* At the largest text size the words get the room, not the icons */
:root[data-ts="xl"] .hol-ic{display:none}
:root[data-ts="xl"] .hol{display:block}

/* standalone site: the page handles the phone's safe areas itself */
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>

<div class="app" id="app">
  <div class="views">

    <section class="view" id="v-today" aria-label="Today">

        <header class="navbar"><div class="navbar-in wrap">

        </div></header>
        <div class="wrap" id="more-body"></div>

      <div class="scroll">
        <header class="navbar"><div class="navbar-in wrap">
          <button class="back-btn" data-act="page-back"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>Settings</button>
          <span class="nav-title">Certifications</span>
          <button class="icon-btn" data-act="cert-add" aria-label="Add a certification"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div></header>
        <div class="wrap"><h1 class="lt">Certifications</h1><div id="certs-body"></div></div>
      </div>

<linearGradient id="mihl" gradientUnits="userSpaceOnUse" x1="492" y1="700" x2="392" y2="610"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/></linearGradient>

pacity=".12" stroke-width="8"/></g></svg>HitchCal</div>
    <button class="tab" data-act="tab" data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>

  <div class="sheet-wrap" id="sheet" hidden>
    <div class="backdrop" data-act="sheet-close"></div>
    <div class="sheet" id="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="grab" id="sheet-grab"></div>
      <div class="sheet-head">
        <button class="txt-btn" id="sheet-left" data-act="sheet-close">Cancel</button>
        <div class="sheet-title" id="sheet-title"></div>
        <button class="txt-btn strong" id="sheet-right" data-act="sheet-primary">Save</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div class="alert-wrap" id="alert" hidden>
    <div class="backdrop" data-act="alert-cancel"></div>
    <div class="asheet" role="alertdialog" aria-modal="true">
      <div class="as-box">
        <div class="as-msg"><b id="alert-title"></b><span id="alert-msg"></span></div>
        <button class="as-btn" id="alert-ok" data-act="alert-ok"></button>
      </div>
      <button class="as-btn cancel" data-act="alert-cancel">Cancel</button>
    </div>
  </div>

  <div class="onboard" id="onboard" hidden>
    <div class="wrap ob-top">
      <button class="txt-btn" id="ob-back" data-act="ob-back">Back</button>
      <div class="dots" id="ob-dots"><i></i><i></i><i></i></div>
      <span class="txt-btn" aria-hidden="true"></span>
    </div>
    <div class="ob-body"><div class="wrap" id="ob-steps"></div></div>
    <div class="wrap ob-foot">
      <button class="btn primary" id="ob-next" data-act="ob-next">Get started</button>
      <button class="btn plain" id="ob-demo" data-act="ob-demo">Explore a sample schedule</button>

/* Home vs away and travel totals for the calendar year */

}

function sharedOff(r, max = 3) {
  const sch = me(), today = startOfDay(new Date()), out = [];

    const d = addDays(today, i), k = toKey(d), both = dayType(k, sch) === 'off' && dayType(k, r) === 'off';

}

/* photo upload: crop to a square, shrink to a small thumbnail and keep it on this device only */
$('#photo-file').addEventListener('change', e => {
  const f = e.target.files[0], pfx = photoTarget; e.target.value = '';
  if (!f || !pick[pfx]) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => {
    const n = 160, c = document.createElement('canvas'), side = Math.min(img.naturalWidth, img.naturalHeight);
    c.width = c.height = n;
    c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, n, n);
    URL.revokeObjectURL(url);
    const data = okPhoto(c.toDataURL('image/jpeg', 0.82));
    if (!data) return toast("That photo couldn't be used");
    pick[pfx].photo = data; pick[pfx].mode = 'photo';
    const box = $('#' + pfx + '-av'); if (box) box.innerHTML = avOpts(pfx);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("That file isn't a photo"); };
  img.src = url;
});

(() => {
  const main = $('#cal-main'); let sx = 0, sy = 0, live = false;
  main.addEventListener('touchstart', e => { if (cal.mode !== 'month' || e.touches.length !== 1) return; live = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  main.addEventListener('touchend', e => { if (!live) return; live = false; const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) calShift(dx < 0 ? 1 : -1); }, { passive: true });
})();

/* drag a sheet down to dismiss */
(() => {
  const card = $('#sheet-card'); let drag = null;
  const start = e => { if (window.innerWidth >= 700 || e.target.closest('button')) return; drag = { y: e.clientY, dy: 0 }; card.style.transition = 'none'; };
  [$('#sheet-grab'), $('.sheet-head')].forEach(z => z.addEventListener('pointerdown', start));
  window.addEventListener('pointermove', e => { if (!drag) return; drag.dy = Math.max(0, e.clientY - drag.y); card.style.transform = `translateY(${drag.dy}px)`; });
  const end = () => { if (!drag) return; const dy = drag.dy; drag = null; card.style.transition = ''; card.style.transform = ''; if (dy > 90) closeSheet(); };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
})();

/* ───────── boot ───────── */
load(); applyTheme(); applyColors(); applyPrefs(); loadServices();
pendingImport = parseShare(location.search);
const famLink = parseFamily(location.search);
if (famLink) showFamily(famLink, false);
else if (S.setup) { showTab('cal'); if (pendingImport) { const pre = pendingImport; pendingImport = null; setTimeout(() => openRoster(null, pre), 400); } }
else startOnboarding();
setInterval(tick, 1000);
if (!EMBEDDED && 'serviceWorker' in navigator && location.protocol === 'https:') {
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW) showUpdate(); });
  navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is optional */ });
}
if (S.setup && !famLink && S.seenVersion !== APP_VERSION) { S.seenVersion = APP_VERSION; save(); setTimeout(() => { if ($('#sheet').hidden) openWhatsNew(); }, 900); }

/* exposed for the schedule-math self-check only */
window.__hitchcal = { familyLink, pdfData: y => loadPdfLib().then(J => buildPdf(J, y).output('datauristring')), cellInfo, nowInfo, hitchBounds, transitions, holidays, dayType, parseShare, toKey };
})();
</script>
</body>
